name: Daily NYC 311 Ingestion & Inference Sync

on:
  schedule:
    # Run daily at 06:00 UTC (02:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of lookback days for rolling window'
        required: false
        default: '60'
      offline_mode:
        description: 'Run offline using local parquet file'
        type: boolean
        default: false

jobs:
  sync:
    name: Ingestion, ML Inference & Outcome Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Compatible ML & Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-learn==1.5.2" pandas numpy joblib requests pyarrow

      - name: Run Pipeline Validation Tests
        run: |
          python -m unittest discover tests

      - name: Execute Daily Ingestion & Inference Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.offline_mode }}" = "true" ]; then
            python worker/run_pipeline.py --offline
          else
            python worker/run_pipeline.py
          fi
